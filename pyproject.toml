[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Local hybrid RAG (dense + BM25) with cross-encoder reranking and Ollama generation"
readme = "README.md"
requires-python = ">=3.11"
# Dependencies are pinned in requirements.txt

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the top-level eval/ and scripts/ packages
